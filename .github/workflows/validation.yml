name: Validate editor
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm audit --audit-level=low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            client/coverage
            server/coverage
# The release additionally requires npm run release:check with a local game
# installation and Chromium. Proprietary game resources are not CI fixtures.
